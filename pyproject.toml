[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-cli"
version = "0.1.0"
description = "A minimal agentic coding CLI backed by a Dify chat app"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
rich = ["rich>=13.0"]
dev = ["pytest>=7.0"]

[project.scripts]
coding-cli = "coding_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coding_cli = ["../../skills/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
